name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Automated Unit & Integration Testing
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          SESSION_SECRET: ci_secret_key_12345

  # ─────────────────────────────────────────────────────────────
  # Job 2: Docker & Infrastructure Validation
  # ─────────────────────────────────────────────────────────────
  docker-validation:
    name: 🐳 Docker & Compose Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-run / Cache test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aplikasi-bank-sampah:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
