name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Stage 1: 🔐 Security Scanning (Gitleaks & Trivy FS Scan)
  # ─────────────────────────────────────────────────────────────
  security-scanning:
    name: 🔐 1. Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Leak Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Trivy Filesystem & Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────
  # Stage 2: 🧱 Infrastructure Validation (Docker Compose & Nginx)
  # ─────────────────────────────────────────────────────────────
  infrastructure-validation:
    name: 🧱 2. Infrastructure Validation
    runs-on: ubuntu-latest
    needs: security-scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "Checking docker-compose.yml syntax..."
          docker compose config --quiet
          echo "✅ Docker Compose config is valid!"

      - name: Validate Nginx Configuration Syntax
        run: |
          echo "Testing Nginx configuration syntax with nginx -t..."
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine nginx -t
          echo "✅ Nginx syntax is valid!"

  # ─────────────────────────────────────────────────────────────
  # Stage 3: 🧪 Testing Stage (Unit & Integration Tests with MySQL)
  # ─────────────────────────────────────────────────────────────
  testing-stage:
    name: 🧪 3. Testing Stage (Jest & Supertest)
    runs-on: ubuntu-latest
    needs: infrastructure-validation

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: bank_sampah_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest Test Suite
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          SESSION_SECRET: ci_test_secret_key_12345
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bank_sampah_test
          DB_USER: test_user
          DB_PASSWORD: test_password

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            tests/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Stage 4: 🐳 Build & Push Docker Image (GHCR + Trivy Image Scan)
  # ─────────────────────────────────────────────────────────────
  build-and-push-docker-image:
    name: 🐳 4. Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: testing-stage
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────
  # Stage 5: ☸️ Kubernetes Deployment (KinD & Kustomize Verification)
  # ─────────────────────────────────────────────────────────────
  kubernetes-deployment:
    name: ☸️ 5. Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: build-and-push-docker-image
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Create KinD (Kubernetes in Docker) Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: bank-sampah-cluster

      - name: Verify Kubernetes Manifests (Server-Side Dry Run)
        run: |
          echo "Verifying compiled Kustomize resources..."
          kubectl kustomize k8s/
          echo "Executing server-side dry run deployment..."
          kubectl apply --dry-run=server -k k8s/
          echo "✅ All Kubernetes manifests passed server-side validation!"

      - name: Deploy Application to Kubernetes Cluster
        run: |
          echo "Deploying to KinD cluster..."
          kubectl apply -k k8s/
          echo "Waiting for rolling deployment rollout to finish..."
          kubectl rollout status deployment/bank-sampah-app --timeout=120s
          kubectl get pods,svc,configmap -o wide

  # ─────────────────────────────────────────────────────────────
  # Stage 6: 📊 Monitoring & Synthetic Health Probe
  # ─────────────────────────────────────────────────────────────
  monitoring:
    name: 📊 6. Monitoring & Synthetic Health Probe
    runs-on: ubuntu-latest
    needs: kubernetes-deployment
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Execute Synthetic Health & Prometheus Metrics Probe
        id: health_probe
        run: |
          echo "Starting synthetic monitoring health check..."
          node -e '
            const http = require("http");
            const app = require("./src/app");
            const server = app.listen(5099, async () => {
              console.log("Synthetic monitoring server started on port 5099");
              try {
                // Probe 1: Healthcheck
                const healthRes = await fetch("http://127.0.0.1:5099/health");
                console.log("Health probe status:", healthRes.status);
                
                // Probe 2: Prometheus Metrics
                const metricsRes = await fetch("http://127.0.0.1:5099/metrics");
                const metricsText = await metricsRes.text();
                console.log("Metrics probe status:", metricsRes.status);
                if (metricsText.includes("process_uptime_seconds")) {
                  console.log("✅ Prometheus metrics scraping verified successfully!");
                } else {
                  throw new Error("Invalid metrics format");
                }
                server.close(() => process.exit(0));
              } catch (err) {
                console.error("❌ Synthetic probe failed:", err);
                server.close(() => process.exit(1));
              }
            });
          '

      - name: Generate DevSecOps & Monitoring Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 DevSecOps CI/CD & Monitoring Pipeline Report

          | Stage | Status | Tool |
          |---|---|---|
          | **1. 🔐 Security Scanning** | Passed | Gitleaks + Trivy FS Scanner |
          | **2. 🧱 Infrastructure Validation** | Passed | Docker Compose + Nginx Syntax Validator |
          | **3. 🧪 Testing Stage** | Passed | Jest & Supertest Suite (20 Tests) + MySQL 8.0 |
          | **4. 🐳 Build & Push Docker Image** | Passed | Multi-stage Dockerfile + GHCR + Trivy Scan |
          | **5. ☸️ Kubernetes Deployment** | Passed | KinD Cluster + Kustomize Manifests + Rolling Update |
          | **6. 📊 Monitoring** | Passed | Synthetic Health Probe + Prometheus /metrics Scraper |

          ### 📦 Deployment Artifacts & Metrics
          * **Container Registry**: `${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}`
          * **Target Port**: `5000`
          * **Prometheus Endpoint**: `/metrics`
          * **Healthcheck Endpoint**: `/health`
          * **PWA Service Worker**: Active (`/sw.js`)
          EOF
