name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Stage 1: 🔐 Security Scanning (Gitleaks & Trivy FS Scan)
  # ───────────────────────────────────────────────────────────────────────────
  security-scanning:
    name: 🔐 1. Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Leak Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Trivy Filesystem & Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 2: 🧱 Infrastructure Validation (Docker Compose & Nginx Syntax)
  # ───────────────────────────────────────────────────────────────────────────
  infrastructure-validation:
    name: 🧱 2. Infrastructure Validation
    runs-on: ubuntu-latest
    needs: security-scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          echo "Checking docker-compose.yml syntax and schema..."
          docker compose config --quiet
          echo "✅ Docker Compose config is valid!"

      - name: Validate Nginx Configuration Syntax
        run: |
          echo "Testing Nginx configuration syntax with nginx -t..."
          docker run --rm \
            --entrypoint nginx \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v ${{ github.workspace }}/nginx/conf.d:/etc/nginx/conf.d:ro \
            nginx:alpine -t -c /etc/nginx/nginx.conf
          echo "✅ Nginx syntax is valid!"

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 3: 🧪 Testing Stage (Express.js Unit & Integration Testing via Jest)
  # ───────────────────────────────────────────────────────────────────────────
  testing:
    name: 🧪 3. Testing Stage (Jest)
    runs-on: ubuntu-latest
    needs: infrastructure-validation

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD || 'test_root_password' }}
          MYSQL_DATABASE: bank_sampah_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint static check
        run: npm run lint

      - name: Run Express.js Unit & Integration Tests (Jest)
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: bank_sampah_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          JWT_SECRET: test_jwt_secret_key_ci

      - name: Upload Test & Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 4: 🐳 Build & Push (Multi-stage Docker Build & Trivy Image Scan)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 4. Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: testing
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Scan Built Container Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # ───────────────────────────────────────────────────────────────────────────
  # Stage 5: ☸️ Deployment Stage (Kubernetes Manifest Verification / Dry-run)
  # ───────────────────────────────────────────────────────────────────────────
  kubernetes-deployment-dryrun:
    name: ☸️ 5. Kubernetes Dry-run Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Verify Kubernetes Manifests (Client Dry-run)
        run: |
          echo "Verifying Kubernetes manifests via kubectl dry-run..."
          kubectl apply --dry-run=client -k k8s/
          echo "✅ All Kubernetes manifests passed client-side dry-run validation!"

      - name: Render Kustomize Resources Summary
        run: |
          echo "Inspecting compiled Kubernetes resources:"
          kubectl kustomize k8s/
