services:
  # ─────────────────────────────────────────────────────────────
  # Database Service (MySQL 8.0)
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: bank_sampah_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aplikasi_sampah
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/aplikasi_sampah.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────
  # Backend Express Application
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank_sampah_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      SESSION_SECRET: ganti_dengan_secret_yang_aman_di_production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: aplikasi_sampah
      AUTO_CREATE_DB: "false"
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - app_network

  # ─────────────────────────────────────────────────────────────
  # Reverse Proxy & Web Server (Nginx)
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bank_sampah_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network

volumes:
  mysql_data:
    name: bank_sampah_mysql_data
  uploads_data:
    name: bank_sampah_uploads_data

networks:
  app_network:
    name: bank_sampah_network
    driver: bridge
